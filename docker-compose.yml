services:
  db:
    image: postgres:15

    environment:
      POSTGRES_DB: issue_tracker_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Amankumar@7404

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .

    command: python manage.py runserver 0.0.0.0:8000

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    depends_on:
      - db

    environment:
      DB_NAME: issue_tracker_db
      DB_USER: postgres
      DB_PASSWORD: Amankumar@7404
      DB_HOST: db
      DB_PORT: 5432

volumes:
  postgres_data: